name: Community Review Build

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: node --check main.js
      - uses: actions/upload-artifact@v4
        with:
          name: tomos-publisher-0.2.2-main-js
          path: main.js
