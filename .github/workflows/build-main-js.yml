name: Build Tomos Publisher

on:
  push:
    branches:
      - agent/sync-image-publisher
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install
      - run: npm run build
      - run: node --check main.js
      - uses: actions/upload-artifact@v4
        with:
          name: tomos-publisher-main-js
          path: main.js
